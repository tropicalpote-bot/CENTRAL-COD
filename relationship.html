<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COD NEXUS • Relacionamento</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e8f0ff;font:15px system-ui}.shell{display:grid;grid-template-columns:310px 1fr;min-height:100vh}aside{padding:25px;background:#152034;border-right:1px solid #31405c;display:grid;align-content:start;gap:14px}main{display:flex;flex-direction:column;height:100vh}header{padding:22px;border-bottom:1px solid #31405c}#chat{flex:1;overflow:auto;padding:25px;display:flex;flex-direction:column;gap:14px}.b{padding:12px 15px;max-width:83%;border-radius:15px;white-space:pre-wrap;line-height:1.5;background:#23344f}.u{align-self:end;background:#2859a2}.a{align-self:start}form{display:flex;padding:20px;gap:10px;border-top:1px solid #31405c}input,textarea{width:100%;border:1px solid #465676;border-radius:9px;padding:11px;background:#0e1729;color:white;font:inherit}button{background:#3678e9;color:white;border:0;border-radius:9px;padding:11px;cursor:pointer}button:disabled{opacity:.5}label{display:grid;gap:6px;font-size:13px}a{color:#8ebeff}small{color:#aabbcf}.badge{color:#98e6ba}#status{font-size:12px;color:#fbd19f}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{padding:14px}main{height:70vh}}</style><div class="shell"><aside><a href="/">← Central COD</a><h2>Agente de relacionamento</h2><span class="badge">Laboratório • sem mensagens ou pedidos reais</span><label>Identificador fictício do cliente<input id="id" value="teste-1"></label><button onclick="load()">Abrir conversa</button><label>Nome do produto<input id="product"></label><label>Preço/condições confirmados<input id="price"></label><label>Benefícios e limitações confirmados<textarea id="details"></textarea></label><label>Prazo/localidades confirmados<textarea id="shipping"></textarea></label><button onclick="saveCatalog()">Salvar catálogo de teste</button><small>Etapa de relacionamento: <b id="stage">Contato inicial</b></small><button onclick="resetChat()">Limpar conversa</button><small>Histórico salvo somente neste navegador. Evite dados pessoais reais. IA requer GEMINI_API_KEY na Vercel.</small></aside><main><header><h2>Simulador de vendas consultivas</h2><div id="status">Nenhum envio real habilitado</div></header><div id="chat"></div><form id="form"><input id="msg" required maxlength="2000" placeholder="Escreva como cliente de teste"><button id="send">Enviar</button></form></main></div><script src="/relationship.js" defer></script></html>
